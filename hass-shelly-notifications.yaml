blueprint:
  name: Detection of Shelly senors for overheating, overpowering and overvoltage
  description: Monitors the Shelly sensors for overheating, overpowering and overvoltage as trigger for user defined actions
  domain: automation
  source_url: https://github.com/FlySmack/hass-shelly-notification
  input:
    shelly_helper_entity:
      name: The Shelly helper entity for problems
      description: A helper entity counting for Shelly problem entities which are turned on
      selector:
        entity:
    exclude:
      name: Excluded Sensors
      description: "Shelly entities to exclude from detection. Only entities are supported, devices must be expanded! Helper entity must be a template sensor offering a total of Shelly problem entities turned on. Use the following template:
      {{  integration_entities('shelly')
        | select('is_state', 'on')
        | select('is_state_attr', 'device_class', 'problem')
        | unique | expand | map(attribute='name') | list| count }}"
      default:
        entity_id: []
      selector:
        target:
          entity:
          - device_class:
            - problem
    user_conditions:
      name: (Optional) Additional Condition(s)
      description: In case of additional conditions must be met, they can be defined here
      default: []
      selector:
        condition: {}
    actions:
      name: Actions
      description: Notifications or similar to be run. {{sensors}} is replaced with the names of sensors having problems.
      selector:
        action: {}
variables:
  exclude: !input exclude
  sensors: >
    {% set result = namespace(sensors=[]) %}
    {% set problem_entities = integration_entities('shelly')
      | reject('in', exclude.entity_id)
      | select('is_state', 'on')
      | select('is_state_attr', 'device_class', 'problem')
      | unique | expand %}
      
    {% for state in problem_entities %}
      {% set area = area_name(state.entity_id) %}
      {% set name = area ~ ' ' ~ state.name if area else state.name %}
      {% set result.sensors = result.sensors + [name] %}
    {% endfor %}
    
    {{ result.sensors | join(', ') }}
trigger:
  - platform: numeric_state
    entity_id: !input shelly_helper_entity
    above: 0
condition:
  - '{{ sensors != '''' }}'
action:
- choose:
  - conditions: !input user_conditions
    sequence: !input actions
mode: single
